<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <!-- Flash Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Registration Card -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0">Create an Account</h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/register}" th:object="${user}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label font-weight-bold">Username</label>
                            <input type="text"
                                   id="username"
                                   th:field="*{username}"
                                   class="form-control"
                                   placeholder="Enter username"
                                   required />
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="password" class="form-label font-weight-bold">Password</label>
                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required />
                        </div>
                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
                    </form>

                </div>
                <div class="card-footer text-center py-3 bg-white border-0">
                    <span class="text-muted">Already have an account?</span>
                    <a th:href="@{/login}" class="text-decoration-none fw-bold ms-1">Log In</a>
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/user/home}" class="text-secondary text-decoration-none">&larr; Back to Home</a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle for alert close button -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
