<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .brand-header {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.15);
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

            <!-- Logout Success Message -->
            <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>You have been logged out successfully.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Registration Success Flash Message -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Login Error Message -->
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Main Login Card -->
            <div class="card login-card bg-white">

                <!-- Card Header -->
                <div class="brand-header text-white text-center py-4 px-3">
                    <div class="mb-2">
                        <i class="bi bi-journal-bookmark-fill display-5"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="small text-white-50 mb-0">Sign in to your Library account</p>
                </div>

                <!-- Form Body -->
                <div class="card-body p-4 p-sm-5">
                    <form th:action="@{/login}" method="post">

                        <!-- Username Field -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text"
                                       id="username"
                                       name="username"
                                       class="form-control bg-light border-start-0"
                                       placeholder="Enter your username"
                                       required
                                       autofocus />
                            </div>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="form-control bg-light border-start-0"
                                       placeholder="Enter your password"
                                       required />
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm" style="background-color: #4f46e5; border-color: #4f46e5;">
                            Sign In <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </form>
                </div>

                <!-- Card Footer -->
                <div class="card-footer text-center py-3 bg-light border-0">
                    <p class="mb-0 text-muted small">
                        Don't have an account?
                        <a th:href="@{/show-register}" class="text-decoration-none fw-bold text-primary">Register here</a>
                    </p>
                </div>
            </div>

            <!-- Back to Home Link -->
            <div class="text-center mt-4">
                <a th:href="@{/user/home}" class="text-muted text-decoration-none small">
                    <i class="bi bi-house me-1"></i>Back to Home
                </a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
