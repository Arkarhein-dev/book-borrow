<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Borrow Records - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Library Management System - Admin Dashboard</a>

        <div class="d-flex align-items-center gap-2">
            <span class="text-light me-2" sec:authorize="isAuthenticated()">
                Hello, <strong sec:authentication="name">Admin</strong>
            </span>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container my-4">

    <!-- Header Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Borrow Records for <span class="text-primary" th:text="${user.username()}">Username</span></h2>
            <p class="text-muted mb-0">Total Records: <strong th:text="${totalItems}">0</strong></p>
        </div>
        <a th:href="@{/admin/user-lists}" class="btn btn-secondary btn-sm">&larr; Back to Users</a>
    </div>

    <!-- Controls Row: Search & Status Filters -->
    <div class="row g-3 align-items-center mb-3">
        <!-- Search Input Form -->
        <div class="col-md-6">
            <form th:action="@{/admin/users/{id}/borrowed(id=${user.id()})}" method="get" class="d-flex gap-2">
                <input type="hidden" name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}">
                <input type="hidden" name="size" th:value="${pageSize}">
                <input type="hidden" name="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDir" th:value="${sortDir}">

                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text"
                           name="keyword"
                           th:value="${keyword}"
                           class="form-control border-start-0 ps-0"
                           placeholder="Search book title or author..."
                           aria-label="Search records">

                    <button class="btn btn-primary px-3" type="submit">
                        Search
                    </button>

                    <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                       th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, status=${selectedStatus}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                       class="btn btn-outline-secondary"
                       title="Clear Search">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- Status Filter Buttons -->
        <div class="col-md-6 d-flex justify-content-md-end gap-2 flex-wrap">
            <a th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, keyword=${keyword}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
               class="btn btn-sm"
               th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline-primary'">
                All
            </a>
            <a th:each="st : ${allStatuses}"
               th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, keyword=${keyword}, status=${st}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
               class="btn btn-sm"
               th:classappend="${selectedStatus == st} ? 'btn-primary' : 'btn-outline-primary'"
               th:text="${st}">
                STATUS
            </a>
        </div>
    </div>

    <!-- Table Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, page=1, keyword=${keyword}, status=${selectedStatus}, size=${pageSize}, sortField='book.title', sortDir=${sortField == 'book.title' ? reverseSortDir : 'asc'})}">
                            Book Title
                            <i th:if="${sortField == 'book.title'}" th:class="${sortDir == 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, page=1, keyword=${keyword}, status=${selectedStatus}, size=${pageSize}, sortField='book.author', sortDir=${sortField == 'book.author' ? reverseSortDir : 'asc'})}">
                            Author
                            <i th:if="${sortField == 'book.author'}" th:class="${sortDir == 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, page=1, keyword=${keyword}, status=${selectedStatus}, size=${pageSize}, sortField='borrowDate', sortDir=${sortField == 'borrowDate' ? reverseSortDir : 'asc'})}">
                            Borrow Date
                            <i th:if="${sortField == 'borrowDate'}" th:class="${sortDir == 'asc' ? 'bi bi-sort-numeric-down' : 'bi bi-sort-numeric-up'}"></i>
                        </a>
                    </th>
                    <th>
                        <a class="text-white text-decoration-none"
                           th:href="@{/admin/users/{id}/borrowed(id=${user.id()}, page=1, keyword=${keyword}, status=${selectedStatus}, size=${pageSize}, sortField='dueDate', sortDir=${sortField == 'dueDate' ? reverseSortDir : 'asc'})}">
                            Due Date
                            <i th:if="${sortField == 'dueDate'}" th:class="${sortDir == 'asc' ? 'bi bi-sort-numeric-down' : 'bi bi-sort-numeric-up'}"></i>
                        </a>
                    </th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(borrowRecords)}">
                    <td colspan="6" class="text-center py-4 text-muted">No borrow records found for this user.</td>
                </tr>

                <tr th:each="record, iter : ${borrowRecords}">
                    <td th:text="${(currentPage - 1) * pageSize + iter.count}">1</td>
                    <td class="fw-semibold" th:text="${record.bookTitle()}">Book Title</td>
                    <td th:text="${record.bookAuthor()}">Author</td>
                    <td th:text="${#temporals.format(record.borrowDate(), 'dd MMM yyyy')}">01 Jan 2026</td>
                    <td th:text="${#temporals.format(record.dueDate(), 'dd MMM yyyy')}">15 Jan 2026</td>
                    <td>
                        <span th:if="${record.status().name() == 'BORROWED'}" class="badge bg-warning text-dark">BORROWED</span>
                        <span th:if="${record.status().name() == 'RETURNED'}" class="badge bg-success">RETURNED</span>
                        <span th:if="${record.status().name() == 'OVERDUE'}" class="badge bg-danger">OVERDUE</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Parameterless Pagination Fragment -->
    <div th:replace="~{fragments/pagination :: paginationControls}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
