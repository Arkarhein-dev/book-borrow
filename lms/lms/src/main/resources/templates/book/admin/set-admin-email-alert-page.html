<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">

        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3 mb-4">
                <h4 class="fw-bold mb-2">
                    <i class="bi bi-clock-history me-2"></i>Admin Email Alert Page
                </h4>
            </div>
            <div class="card-body py-0">
                <form th:action="@{/admin/settings}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semi-bold ">Admin Notification Email</label>
                        <input type="email"
                                name="adminEmail"
                               class="form-control"
                               required
                               placeholder="admin@gmail.com"
                        >
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semi-bold ">Trigger Time</label>
                        <input type="time"
                            name="triggerTime"
                               class="form-control"
                               required
                        >
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="d-grid my-3">
                        <button class="btn btn-primary btn-lg fs-6 fw-semibold">
                            <i class="bi bi-save me-1"></i>Save Schedule
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
