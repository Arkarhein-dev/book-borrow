<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dynamic Title based on whether book.id exists -->
    <title th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}">Book Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            
            <div class="card-header text-white" 
                 th:classappend="${book.id == null ? 'bg-success' : 'bg-warning text-dark'}">
                <h4 class="mb-0" th:text="${book.id == null ? 'Add New Book' : 'Edit Book'}">Form Title</h4>
            </div>
            
            <div class="card-body">
                <form th:action="@{/admin/books/save}" th:object="${book}" method="post">
                    
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="title" class="form-label font-weight-bold">Book Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Clean Code" required />
                    </div>

                    <!-- Author Field -->
                    <div class="mb-3">
                        <label for="author" class="form-label font-weight-bold">Author Name</label>
                        <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="e.g. Robert C. Martin" required />
                    </div>

                    <div class="mb-3">
                        <label for="stock" class="form-label font-weight-bold">Stock Quantity</label>
                        <input type="number" id="stock" th:field="*{stock}" class="form-control" min="0" required />
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">Cancel</a>
                        
                        <button type="submit" 
                                class="btn" 
                                th:classappend="${book.id == null ? 'btn-success' : 'btn-warning'}"
                                th:text="${book.id == null ? 'Save Book' : 'Update Book'}">
                            Submit
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
