<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">	

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">Library Management System - Admin Dashboard</a>
            
            <div class="d-flex align-items-center gap-2">
                <!-- Greeting -->
                <span class="text-light me-2" sec:authorize="isAuthenticated()">
                    Hello, <strong sec:authentication="name">Admin</strong>
                </span>

                <!-- Logout Link -->
                <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        
        <!-- Header & Action Bar -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Book List</h2>
            <a th:href="@{/admin/books/new}" class="btn btn-success">+ Add New Book</a>
        </div>
        
        <!-- Book Table Card -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Stock</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                No books available in the inventory.
                            </td>
                        </tr>

                        <!-- Iterated Book Rows -->
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}">1</td>
                            <td th:text="${book.title}">Sample Title</td>
                            <td th:text="${book.author}">Sample Author</td>
                            <td th:text="${book.stock}">10</td>
                            <td class="text-center ">
                                    <!-- Edit Link -->
                                    <a th:href="@{/admin/books/edit/{id}(id=${book.id})}" 
                                       class="btn btn-warning btn-sm mx-2">
                                        Edit
                                    </a>
                                    
                                    <form th:action="@{/admin/books/delete/{id}(id=${book.id})}" 
                                          method="post" 
                                          class="d-inline"
                                          onclick="return confirm('Are you sure you want to delete this book?');">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            Delete
                                        </button>
                                    </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
