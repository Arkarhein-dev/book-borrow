<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registered Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-people-fill text-primary me-2"></i>Registered Users</h2>
            <p class="text-muted mb-0">Select a user to inspect their borrowed digital books</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">&larr; Back to Dashboard</a>
    </div>

    <!-- Users Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="text-center py-4 text-muted">No users found in database.</td>
                </tr>
                <tr th:each="u, iter : ${users}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <i class="bi bi-person-circle text-secondary me-2"></i>
                        <strong th:text="${u.username}">Username</strong>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${u.role}">ROLE_USER</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/users/{userId}/borrowed(userId=${u.id})}"
                           class="btn btn-primary btn-sm">
                            <i class="bi bi-journal-bookmark me-1"></i> View Borrowed Books
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
