<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">

    <!-- Header & Actions -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0"><i class="bi bi-people-fill text-primary me-2"></i>Registered Users</h2>
            <p class="text-muted mb-0">Total Registered Users: <strong th:text="${totalItems}">0</strong></p>
        </div>

        <div class="d-flex align-items-center gap-2">
            <!-- Sort Dropdown -->
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle btn-sm" type="button" data-bs-toggle="dropdown">
                    Sort By: <span th:text="${sortField}">username</span> (<span th:text="${#strings.toUpperCase(sortDir)}">ASC</span>)
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                    <li>
                        <!-- Updated: page=1, size=${pageSize} -->
                        <a class="dropdown-item"
                           th:href="@{/admin/user-lists(page=1, size=${pageSize}, sortField='username', sortDir=${sortField == 'username' ? reverseSortDir : 'asc'})}">
                            <i class="bi bi-person me-1"></i> Username
                        </a>
                    </li>
                    <li>
                        <!-- Updated: page=1, size=${pageSize} -->
                        <a class="dropdown-item"
                           th:href="@{/admin/user-lists(page=1, size=${pageSize}, sortField='role', sortDir=${sortField == 'role' ? reverseSortDir : 'asc'})}">
                            <i class="bi bi-shield-lock me-1"></i> Role
                        </a>
                    </li>
                </ul>
            </div>

            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">&larr; Back to Dashboard</a>
        </div>
    </div>

    <!-- Users Table -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th style="width: 80px;">#</th>
                    <th>
                        <!-- Updated: page=${currentPage}, size=${pageSize} -->
                        <a class="text-white text-decoration-none"
                           th:href="@{/admin/user-lists(page=${currentPage}, size=${pageSize}, sortField='username', sortDir=${sortField == 'username' ? reverseSortDir : 'asc'})}">
                            Username
                            <i th:if="${sortField == 'username'}" th:class="${sortDir == 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th>
                        <!-- Updated: page=${currentPage}, size=${pageSize} -->
                        <a class="text-white text-decoration-none"
                           th:href="@{/admin/user-lists(page=${currentPage}, size=${pageSize}, sortField='role', sortDir=${sortField == 'role' ? reverseSortDir : 'asc'})}">
                            Role
                            <i th:if="${sortField == 'role'}" th:class="${sortDir == 'asc' ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="text-center py-4 text-muted">No users found in database.</td>
                </tr>

                <!-- Iterated User Rows -->
                <tr th:each="u, iter : ${users}">
                    <td th:text="${(currentPage - 1) * pageSize + iter.count}">1</td>
                    <td>
                        <i class="bi bi-person-circle text-secondary me-2"></i>
                        <strong th:text="${u.username}">Username</strong>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${u.role}">ROLE_USER</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/admin/users/{userId}/borrowed(userId=${u.id})}"
                           class="btn btn-primary btn-sm">
                            <i class="bi bi-journal-bookmark me-1"></i> View Borrowed Books
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination Fragment -->
    <div th:replace="~{/fragments/pagination :: paginationControls(
            baseUrl='/admin/user-lists',
            currentPage=${currentPage},
            totalPages=${totalPages},
            pageSize=${pageSize},
            sortField=${sortField},
            sortDir=${sortDir}
         )}">
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
