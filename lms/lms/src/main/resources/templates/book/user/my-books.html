<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Borrowed Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/home}">Library Management System</a>

        <div class="d-flex align-items-center gap-2">
            <!-- Authenticated User -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="text-light me-2">
                    Hello, <strong sec:authentication="name">User</strong>
                </span>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-warning btn-sm">Admin Dashboard</a>
                <a th:href="@{/user/my-books}" class="btn btn-primary btn-sm">My Books</a>
                <a th:href="@{/logout}" class="btn btn-danger btn-sm">Logout</a>
            </div>

            <!-- Anonymous User -->
            <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Login</a>
                <a th:href="@{/show-register}" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>My Borrowed Books</h3>
        <a th:href="@{/user/home}" class="btn btn-secondary btn-sm">&larr; Back to Home</a>
    </div>

    <!-- Search Form & Status Filters Row -->
    <div class="row g-3 align-items-center mb-3">
        <!-- Search Input Form -->
        <div class="col-md-6">
            <form th:action="@{/user/my-books}" method="get" class="d-flex gap-2">
                <!-- Keep active status, size, and sorting intact when submitting search -->
                <input type="hidden" name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}">
                <input type="hidden" name="size" th:value="${pageSize}">
                <input type="hidden" name="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDir" th:value="${sortDir}">

                <div class="input-group">
                    <input type="text"
                           name="keyword"
                           class="form-control form-control-sm"
                           placeholder="Search by title or author..."
                           th:value="${keyword}">
                    <button class="btn btn-primary btn-sm" type="submit">
                        <i class="bi bi-search"></i> Search
                    </button>
                    <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                       th:href="@{/user/my-books(status=${selectedStatus}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                       class="btn btn-outline-secondary btn-sm">
                        Clear
                    </a>
                </div>
            </form>
        </div>

        <!-- Status Filter Buttons -->
        <div class="col-md-6 d-flex justify-content-md-end gap-2">
            <a th:href="@{/user/my-books(keyword=${keyword}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
               class="btn btn-sm"
               th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline-primary'">
                All Records
            </a>
            <a th:each="st : ${allStatuses}"
               th:href="@{/user/my-books(keyword=${keyword}, status=${st}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
               class="btn btn-sm"
               th:classappend="${selectedStatus == st} ? 'btn-primary' : 'btn-outline-primary'"
               th:text="${st}">
                STATUS
            </a>
        </div>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Book Title</th>
                    <th>Author</th>
                    <th>Borrow Date</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(borrowRecords)}">
                    <td colspan="7" class="text-center py-4 text-muted">No borrowed books found.</td>
                </tr>

                <tr th:each="record, iter : ${borrowRecords}">
                    <td th:text="${(currentPage - 1) * pageSize + iter.count}">1</td>
                    <td class="fw-semibold" th:text="${record.book.title}">Book Title</td>
                    <td th:text="${record.book.author}">Author</td>
                    <td th:text="${#temporals.format(record.borrowDate, 'dd MMM yyyy')}">01 Jan 2026</td>
                    <td th:text="${#temporals.format(record.dueDate, 'dd MMM yyyy')}">15 Jan 2026</td>
                    <td>
                        <span th:if="${record.status.name() == 'BORROWED'}" class="badge bg-warning text-dark">BORROWED</span>
                        <span th:if="${record.status.name() == 'RETURNED'}" class="badge bg-success">RETURNED</span>
                        <span th:if="${record.status.name() == 'OVERDUE'}" class="badge bg-danger">OVERDUE</span>
                    </td>
                    <td>
                        <form th:if="${record.status.name() == 'BORROWED' || record.status.name() == 'OVERDUE'}"
                              th:action="@{/user/return-book/{recordId}(recordId=${record.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Return Book</button>
                        </form>
                        <span th:unless="${record.status.name() == 'BORROWED' || record.status.name() == 'OVERDUE'}" class="text-muted">-</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination Component Fragment -->
    <div th:replace="~{fragments/pagination :: paginationControls}"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
