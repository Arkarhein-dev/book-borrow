<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Borrow Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/home}">Library Management System</a>

        <div class="d-flex align-items-center gap-2">

            <!--Login user-->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="text-light me-2">
                    Hello, <strong sec:authentication="name">User</strong>
                </span>

                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-warning btn-sm">Admin Dashboard</a>

                <a th:href="@{/user/my-books}" class="btn btn-primary btn-sm">My Books</a>
                <a th:href="@{/logout}" class="btn btn-danger btn-sm">Logout</a>
            </div>

            <!-- Anonymous User -->
            <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Login</a>
                <a th:href="@{/show-register}" class="btn btn-primary btn-sm">Register</a>
            </div>

        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center my-3">
        <h3>My Borrowed Books</h3>
        <a th:href="@{/user/home}" class="btn btn-secondary">&larr; Back to Home</a>
    </div>


    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Book Title</th>
                    <th>Author</th>
                    <th>Borrow Date</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Shown when the user has no active borrowed books -->
                <tr th:if="${#lists.isEmpty(records)}">
                    <td colspan="6" class="text-center py-4 text-muted">You have no borrowed books.</td>
                </tr>

                <!-- Iterates through active borrow records -->
                <tr th:each="record : ${records}">
                    <td th:text="${record.book.title}">Book Title</td>
                    <td th:text="${record.book.author}">Author</td>
                    <td th:text="${record.borrowDate}">Borrow Date</td>
                    <td th:text="${record.dueDate}">Due Date</td>
                    <td>
                        <span th:text="${record.status}" class="badge bg-warning text-dark">BORROWED</span>
                    </td>
                    <td>
                        <!-- Fixed path: Added /user/ prefix -->
                        <form th:action="@{/user/return-book/{recordId}(recordId=${record.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Return Book</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS for alert dismissals and interactivity -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
