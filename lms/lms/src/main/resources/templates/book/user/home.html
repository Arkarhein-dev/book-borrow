<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Manage Book - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/home}">Library Management System</a>

        <div class="d-flex align-items-center gap-2">

            <!--Login user-->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="text-light me-2">
                    Hello, <strong sec:authentication="name">User</strong>
                </span>

                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-warning btn-sm">Admin Dashboard</a>

                <a th:href="@{/user/my-books}" class="btn btn-primary btn-sm">My Books</a>
                <a th:href="@{/logout}" class="btn btn-danger btn-sm">Logout</a>
            </div>

            <!-- Anonymous User -->
            <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm">Login</a>
                <a th:href="@{/show-register}" class="btn btn-primary btn-sm">Register</a>
            </div>

        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container my-5">

    <!-- Display success/error messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" class="text-center py-4 text-muted">No books found.</td>
                </tr>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}">1</td>
                    <td th:text="${book.title}">Sample Title</td>
                    <td th:text="${book.author}">Sample Author</td>
                    <td th:text="${book.stock}">5</td>
                    <td>
                        <span th:if="${book.stock > 0 and book.available}" class="badge bg-success">Available</span>
                        <span th:unless="${book.stock > 0 and book.available}" class="badge bg-danger">Out of Stock</span>
                    </td>
                    <td>
                        <!-- LOGGED IN USER: Borrow button submits form -->
                        <div sec:authorize="isAuthenticated()">
                            <form th:action="@{/user/borrow-book/{id}(id=${book.id})}" method="post">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-primary"
                                        th:disabled="${book.stock <= 0 or !book.available}">
                                    Borrow
                                </button>
                            </form>
                        </div>

                        <!-- GUEST USER: Borrow button redirects to /login -->
                        <div sec:authorize="isAnonymous()">
                            <a th:href="@{/login}"
                               class="btn btn-sm btn-outline-secondary"
                               th:classappend="${book.stock <= 0 or !book.available} ? 'disabled'">
                                Login to Borrow
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
