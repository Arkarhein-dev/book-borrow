<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Manage Book - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/user/home}">Library Management System</a>
            
            <div class="d-flex align-items-center gap-2">
                <!-- Logged in user greeting -->
                <span class="text-light me-2" sec:authorize="isAuthenticated()">
                    Hello, <strong sec:authentication="name">User</strong>
                </span>

                <a th:href="@{/user/my-books}" class="btn btn-primary">My Books</a>
                
                <a th:href="@{/logout}" class="btn btn-danger">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container my-5">
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="5" class="text-center py-4 text-muted">No books found.</td>
                        </tr>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.id}">1</td>
                            <td th:text="${book.title}">Sample Title</td>
                            <td th:text="${book.author}">Sample Author</td>
                            <td th:text="${book.stock}">5</td>
                            <td>
                                <a th:href="@{/user/buy/{id}(id=${book.id})}" class="btn btn-sm btn-outline-primary">Buy</a>
                            </td>
                        </tr>
                    </tbody>        
                </table>
            </div>
        </div>
    </div>
</body>
</html>
