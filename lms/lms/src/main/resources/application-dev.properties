# ==========================================
# QUARTZ JDBC PERSISTENCE CONFIGURATION
# ==========================================
# 1. Enable JDBC persistence using WildFly's JNDI DataSource
spring.quartz.job-store-type=jdbc

# Explicitly use Spring's JNDI primary datasource for Quartz
spring.quartz.properties.org.quartz.jobStore.dataSource=default

# 2. Schema initialization handled by MySQL / Quartz SQL script
spring.quartz.jdbc.initialize-schema=never

# 3. MySQL-specific driver delegate for Quartz
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate

# 4. Reschedule/update jobs on restart
spring.quartz.overwrite-existing-jobs=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true

