# ==========================================
# QUARTZ JDBC PERSISTENCE CONFIGURATION
# ==========================================
# 1. Enable JDBC persistence using Spring's DataSource
spring.quartz.job-store-type=jdbc

# 2. Auto-create Quartz schema tables (QRTZ_*) in MySQL if missing
spring.quartz.jdbc.initialize-schema=always

# 3. MySQL-specific driver delegate for Quartz
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate

# 4. Reschedule/update jobs when expressions change on app restart
spring.quartz.overwrite-existing-jobs=true
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
